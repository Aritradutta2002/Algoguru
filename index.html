    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Icons: SVG for modern browsers, multi-res ICO for legacy, PNG for
         iOS home screens, and a monochrome mask for Safari pinned tabs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#6366F1" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts are loaded here (not via a blocking CSS @import) so the first
         paint is not held up. Only the four families the product uses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:ital,wght@0,400..600;1,400&family=Source+Sans+3:wght@300..700&family=Space+Grotesk:wght@400..700&display=swap"
    />

    <!-- Apply the saved theme before React mounts. Without this the app paints
         its light theme for a frame and then snaps to dark. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cp-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          var root = document.documentElement;
          root.classList.add(theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", theme === "dark" ? "#070709" : "#FAFAF8");
          }
        } catch (error) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>

    <!-- Pre-hydration splash: paints the brand immediately so a cold load never
         shows an empty page. `main.tsx` fades and removes it on mount. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        /* Same ambient wash the hydrated AppLoadingScreen paints behind the
           loader, so the two frames cross-fade without a visible jump. */
        background:
          radial-gradient(
            42rem 30rem at 50% 42%,
            rgba(99, 102, 241, 0.16),
            rgba(99, 102, 241, 0) 70%
          ),
          #070709;
        transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1), visibility 260ms;
      }

      html.light #boot-splash {
        background:
          radial-gradient(
            42rem 30rem at 50% 42%,
            rgba(99, 102, 241, 0.1),
            rgba(99, 102, 241, 0) 70%
          ),
          #fafaf8;
      }

      #boot-splash[data-state="leaving"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Mirrors .agl--screen: stage + label column, centred on the viewport.
         Both the splash and the loader use the same stage size and the same
         column gap, so the mark lands on identical pixels during the fade. */
      .boot-splash__inner {
        display: flex;
        justify-content: center;
      }

      .bsl {
        --bsl-cycle: 2.4s;
        --bsl-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --bsl-indigo: #6366f1;
        --bsl-cyan: #22d3ee;
        --bsl-muted: rgba(248, 250, 252, 0.66);
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 1.15rem;
      }

      html.light .bsl {
        --bsl-muted: rgba(15, 23, 42, 0.62);
      }

      .bsl__stage {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 116px;
        height: 116px;
      }

      .bsl__wash {
        position: absolute;
        inset: -18%;
        border-radius: 9999px;
        background: radial-gradient(closest-side, rgba(99, 102, 241, 0.22), transparent);
        animation: bsl-wash var(--bsl-cycle) var(--bsl-ease) infinite;
      }

      .bsl__plate {
        position: relative;
        display: inline-grid;
        place-items: center;
        border-radius: 26%;
        overflow: hidden;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 18px 36px -18px rgba(2, 6, 23, 0.55);
      }

      .bsl__mark,
      .bsl__glyph {
        display: block;
      }

      .bsl__glyph {
        position: absolute;
        inset: 0;
        margin: auto;
        overflow: visible;
        z-index: 1;
      }

      .bsl__fill {
        opacity: 0;
        animation: bsl-fill var(--bsl-cycle) var(--bsl-ease) infinite;
      }

      .bsl__burst {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: bsl-burst var(--bsl-cycle) var(--bsl-ease) infinite;
      }

      .bsl__spark {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: bsl-spark var(--bsl-cycle) var(--bsl-ease) infinite;
      }

      .bsl__label {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: 0.005em;
        color: var(--bsl-muted);
      }

      .bsl__meter {
        position: relative;
        display: block;
        width: 128px;
        height: 1px;
        margin-top: -0.15rem;
        border-radius: 9999px;
        overflow: hidden;
        background: rgba(248, 250, 252, 0.09);
      }

      .bsl__meter-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 38%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          transparent,
          var(--bsl-indigo) 22%,
          #3b82f6 48%,
          var(--bsl-cyan) 72%,
          transparent
        );
        animation: bsl-meter 1.7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes bsl-fill {
        0%,
        36% {
          opacity: 0;
        }
        50%,
        84% {
          opacity: 1;
        }
        92%,
        100% {
          opacity: 0;
        }
      }

      @keyframes bsl-burst {
        0%,
        33% {
          opacity: 0;
          transform: scale(0.35);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
        60%,
        100% {
          opacity: 0;
          transform: scale(1.7);
        }
      }

      @keyframes bsl-spark {
        0%,
        34% {
          opacity: 0;
          transform: scale(0.2);
        }
        41% {
          opacity: 1;
          transform: scale(1.35);
        }
        52%,
        84% {
          opacity: 1;
          transform: scale(1);
        }
        92%,
        100% {
          opacity: 0;
          transform: scale(0.6);
        }
      }

      @keyframes bsl-wash {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.96);
        }
        52% {
          opacity: 0.95;
          transform: scale(1.03);
        }
      }

      @keyframes bsl-meter {
        0% {
          transform: translate3d(-110%, 0, 0);
        }
        100% {
          transform: translate3d(295%, 0, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bsl__fill,
        .bsl__spark {
          animation: none;
          opacity: 1;
        }

        .bsl__burst,
        .bsl__wash {
          animation: none;
        }

        .bsl__wash {
          opacity: 0.8;
        }

        .bsl__burst {
          opacity: 0;
        }

        .bsl__meter-bar {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>

  <body>

                <path d="M32 1.5L50 20.5L32 39.5L14 20.5Z" fill="#FFFFFF" fill-opacity="0.12"/>
                <use href="#bslTilePath" fill="none" stroke="url(#bslRim)" stroke-width="1.3"/>
              </svg>
              <svg class="bsl__glyph" width="66" height="66" viewBox="0 0 64 64" fill="none" aria-hidden="true" focusable="false">
                <defs>
                  <radialGradient id="bslBurst">
                    <stop offset="0%" stop-color="#FFFFFF"/>
                    <stop offset="34%" stop-color="#22D3EE" stop-opacity="0.9"/>
                    <stop offset="72%" stop-color="#3B82F6" stop-opacity="0.32"/>
                    <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
                  </radialGradient>
                </defs>
                <circle class="bsl__burst" cx="39.7" cy="37.3" r="15" fill="url(#bslBurst)"/>
                <g fill="#FFFFFF">
                  <path class="bsl__fill" d="M28.8 14L28.8 19.4L26.2 50.4L22.4 50.4L19.8 19.4L22.4 14Z"/>
                  <path class="bsl__fill" d="M35.2 14L35.2 19.4L37.8 50.4L41.6 50.4L44.2 19.4L41.6 14Z"/>
                  <path class="bsl__fill" d="M20.4 35L37.6 35L37.6 39.6L20.4 39.6Z"/>
                </g>
                <g class="bsl__spark">
                  <circle cx="39.7" cy="37.3" r="2.6" fill="#22D3EE"/>
                  <circle cx="39.7" cy="37.3" r="1.17" fill="#FFFFFF"/>
                </g>
              </svg>
            </span>
          </span>
          <p class="bsl__label">Preparing your workspace</p>
          <span class="bsl__meter"><span class="bsl__meter-bar"></span></span>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
