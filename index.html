    <!-- Icons: SVG for modern browsers, multi-res ICO for legacy, PNG for
         iOS home screens, and a monochrome mask for Safari pinned tabs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#2F6BE8" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts are loaded here (not via a blocking CSS @import) so the first
         paint is not held up. Only the four families the product uses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:ital,wght@0,400..600;1,400&family=Source+Sans+3:wght@300..700&family=Space+Grotesk:wght@400..700&display=swap"
    />

    <!-- Apply the saved theme before React mounts. Without this the app paints
         its light theme for a frame and then snaps to dark. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cp-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          var root = document.documentElement;
          root.classList.add(theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", theme === "dark" ? "#07090D" : "#FAFAF8");
          }
        } catch (error) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>

    <!-- Pre-hydration splash: paints the brand immediately so a cold load never
         shows an empty page. `main.tsx` fades and removes it on mount. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fafaf8;
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      html.dark #boot-splash {
        background: #07090d;
      }

      #boot-splash[data-state="leaving"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        /* The hydrated screen centres a stage + label column, which puts its
           mark ~19.5px above the viewport centre. Matching that offset means
           the two marks land on the same pixels during the cross-fade. */
        padding-bottom: 39px;
      }

      .boot-splash__badge {
        position: relative;
        display: grid;
        place-items: center;
        width: 124px;
        height: 124px;
      }

      .boot-splash__badge::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 2px solid rgba(47, 107, 232, 0.16);
      }

      .boot-splash__orbit {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: conic-gradient(
          from 0turn,
          rgba(47, 107, 232, 0) 0turn,
          rgba(47, 107, 232, 0) 0.32turn,
          rgba(47, 107, 232, 0.55) 0.66turn,
          #2f6be8 0.86turn,
          rgba(47, 107, 232, 0) 1turn
        );
        -webkit-mask: radial-gradient(farthest-side, #0000 calc(100% - 2px), #000 calc(100% - 1.5px));
        mask: radial-gradient(farthest-side, #0000 calc(100% - 2px), #000 calc(100% - 1.5px));
        animation: boot-orbit 2.6s linear infinite;
        will-change: transform;
      }

      /* Counter-rotating cyan arc: the loader's second orbit, mirrored here so
         the splash and the hydrated loading screen are the same object. */
      .boot-splash__orbit--inner {
        inset: 8%;
        background: conic-gradient(
          from 0turn,
          rgba(111, 227, 248, 0) 0turn,
          rgba(111, 227, 248, 0) 0.5turn,
          rgba(111, 227, 248, 0.65) 0.84turn,
          rgba(111, 227, 248, 0) 1turn
        );
        -webkit-mask: radial-gradient(farthest-side, #0000 calc(100% - 1.5px), #000 calc(100% - 1px));
        mask: radial-gradient(farthest-side, #0000 calc(100% - 1.5px), #000 calc(100% - 1px));
        animation: boot-orbit 4.4s linear infinite reverse;
      }

      .boot-splash__halo {
        position: absolute;
        inset: 6%;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(47, 107, 232, 0.34), transparent 64%);
        filter: blur(5px);
        animation: boot-halo 3.6s ease-in-out infinite;
      }

      .boot-splash__mark {
        position: relative;
        display: block;
        filter: drop-shadow(0 6px 16px rgba(28, 79, 214, 0.35));
      }

      @keyframes boot-orbit {
        to {
          transform: rotate(1turn);
        }
      }

      @keyframes boot-halo {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.06);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash__orbit--inner,
        .boot-splash__halo {
          animation: none;
        }

        .boot-splash__orbit {
          animation: none;
          transform: rotate(-0.14turn);
        }

        .boot-splash__orbit--inner {
          opacity: 0.55;
          transform: rotate(0.3turn);
        }

        .boot-splash__halo {
          opacity: 0.75;
        }
      }
    </style>
  </head>

  <body>
