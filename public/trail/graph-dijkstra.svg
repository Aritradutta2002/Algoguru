<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="graphBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#graphBg)" stroke="#134e4a" stroke-width="2" />
  <text x="24" y="34" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">GRAPH ALGORITHM // DIJKSTRA SHORTEST PATH</text>
  <text x="376" y="34" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10">O(E log V)</text>

  <!-- Non-optimal Edges -->
  <line x1="80" y1="130" x2="180" y2="80" stroke="#1e293b" stroke-width="2" />
  <text x="125" y="100" fill="#64748b" font-family="monospace" font-size="9">w: 4</text>

  <line x1="180" y1="80" x2="310" y2="110" stroke="#1e293b" stroke-width="2" />
  <text x="245" y="90" fill="#64748b" font-family="monospace" font-size="9">w: 7</text>

  <line x1="180" y1="200" x2="180" y2="80" stroke="#1e293b" stroke-width="2" stroke-dasharray="2 2" />
  <text x="190" y="145" fill="#64748b" font-family="monospace" font-size="9">w: 3</text>

  <!-- Shortest Path Highlighted Edges -->
  <line x1="80" y1="130" x2="180" y2="200" stroke="#10b981" stroke-width="3" />
  <text x="120" y="175" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">w: 1</text>

  <line x1="180" y1="200" x2="310" y2="110" stroke="#10b981" stroke-width="3" />
  <text x="250" y="165" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">w: 2</text>

  <!-- Nodes -->
  <!-- Source A -->
  <g filter="url(#emeraldGlow)">
    <circle cx="80" cy="130" r="18" fill="url(#emeraldGrad)" />
  </g>
  <text x="80" y="135" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">S</text>
  <text x="80" y="160" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="9">d: 0</text>

  <!-- Node B -->
  <circle cx="180" cy="80" r="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <text x="180" y="84" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="11">B</text>
  <text x="180" y="60" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">d: 4</text>

  <!-- Node C (on optimal path) -->
  <circle cx="180" cy="200" r="18" fill="#064e3b" stroke="#10b981" stroke-width="2.5" />
  <text x="180" y="205" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">C</text>
  <text x="180" y="230" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold">d: 1</text>

  <!-- Destination T -->
  <g filter="url(#emeraldGlow)">
    <circle cx="310" cy="110" r="20" fill="url(#emeraldGrad)" />
  </g>
  <text x="310" y="115" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">T</text>
  <text x="310" y="142" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="bold">d: 3 (MIN)</text>

  <!-- Min Heap Status -->
  <rect x="24" y="258" width="180" height="24" rx="6" fill="#022c22" stroke="#059669" stroke-width="1" />
  <text x="114" y="274" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="10">MIN HEAP: [C(1), T(3), B(4)]</text>
</svg>