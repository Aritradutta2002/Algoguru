<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="sysBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#sysBg)" stroke="#27272a" stroke-width="2" />
  <text x="24" y="34" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">SYSTEM DESIGN // DISTRIBUTED EVENT CLUSTER</text>
  <text x="376" y="34" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10">100K RPS</text>

  <!-- Flow Boxes -->
  <!-- Client -->
  <rect x="24" y="90" width="70" height="50" rx="8" fill="#18181b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="59" y="112" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">Clients</text>
  <text x="59" y="126" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">HTTPS / WSS</text>

  <!-- Arrow -->
  <path d="M94 115 L124 115" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- API Gateway -->
  <rect x="124" y="75" width="84" height="80" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5" />
  <text x="166" y="105" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-weight="bold" font-size="11">API Gateway</text>
  <text x="166" y="122" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">Rate Limiter</text>
  <text x="166" y="136" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">JWT Auth</text>

  <!-- Arrow -->
  <path d="M208 100 L240 70 M208 130 L240 160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Redis Cache (Fast path) -->
  <rect x="240" y="55" width="134" height="42" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
  <text x="307" y="74" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-weight="bold" font-size="10">Redis L2 Cache</text>
  <text x="307" y="88" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="8">Sub-ms Read Invariant</text>

  <!-- Kafka / Worker Queue -->
  <rect x="240" y="115" width="134" height="42" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
  <text x="307" y="134" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif" font-weight="bold" font-size="10">Kafka Event Bus</text>
  <text x="307" y="148" text-anchor="middle" fill="#a5b4fc" font-family="monospace" font-size="8">Partitioned Topics</text>

  <!-- Database Shards -->
  <rect x="240" y="175" width="134" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="307" y="194" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-weight="bold" font-size="10">Postgres Cluster</text>
  <text x="307" y="208" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="8">Consistent Hashing</text>

  <!-- Bottom Metric -->
  <rect x="24" y="258" width="170" height="24" rx="6" fill="#18181b" stroke="#38bdf8" stroke-width="1" />
  <text x="109" y="274" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">LATENCY P99: 1.8ms</text>
</svg>