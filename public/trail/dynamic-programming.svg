<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="dpBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#dpBg)" stroke="#1e293b" stroke-width="2" />
  <text x="24" y="34" fill="#a855f7" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">DYNAMIC PROGRAMMING // 0/1 KNAPSACK</text>
  <text x="376" y="34" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10">O(N × W) MEMO</text>

  <!-- Formula Callout -->
  <rect x="24" y="52" width="352" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="36" y="73" fill="#c7d2fe" font-family="monospace" font-size="11">dp[i][w] = max(dp[i-1][w], val[i] + dp[i-1][w - wt[i]])</text>

