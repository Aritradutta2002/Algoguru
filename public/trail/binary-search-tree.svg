<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="bstBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="blueNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bstBg)" stroke="#1e293b" stroke-width="2" />
  <g opacity="0.15">
    <path d="M0 50h400M0 100h400M0 150h400M0 200h400M0 250h400M50 0v300M100 0v300M150 0v300M200 0v300M250 0v300M300 0v300M350 0v300" stroke="#38bdf8" stroke-width="1" />
  </g>
  <text x="24" y="34" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">ALGORITHM // AVL TREE ROTATION</text>
  <text x="376" y="34" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10">O(log N) SEARCH</text>
  
  <!-- Edges -->
  <path d="M200 80 L110 140 M200 80 L290 140" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M110 140 L65 210 M110 140 L155 210" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.5" />
  <path d="M290 140 L245 210 M290 140 L335 210" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.5" />

  <!-- Root -->
  <g filter="url(#glow)">
    <circle cx="200" cy="80" r="22" fill="url(#cyanNode)" />
  </g>
  <text x="200" y="86" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">42</text>
  <rect x="228" y="66" width="38" height="16" rx="4" fill="#0284c7" opacity="0.8" />
  <text x="247" y="78" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9">BF: 0</text>

  <!-- Level 1 -->
  <circle cx="110" cy="140" r="18" fill="url(#blueNode)" />
  <text x="110" y="145" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">21</text>

  <circle cx="290" cy="140" r="18" fill="url(#blueNode)" />
  <text x="290" y="145" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">64</text>

  <!-- Level 2 -->
  <circle cx="65" cy="210" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="65" y="214" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="11">12</text>

  <circle cx="155" cy="210" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="155" y="214" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="11">33</text>

  <circle cx="245" cy="210" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="245" y="214" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="11">52</text>

  <circle cx="335" cy="210" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="335" y="214" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="11">89</text>

  <!-- Balance Badge -->
  <rect x="24" y="260" width="130" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="89" y="275" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">BALANCED HEIGHT: 3</text>
</svg>