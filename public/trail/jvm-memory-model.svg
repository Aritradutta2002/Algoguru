<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="jvmBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#jvmBg)" stroke="#312e81" stroke-width="2" />
  <text x="24" y="34" fill="#fb923c" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">JAVA RUNTIME // JVM MEMORY ARCHITECTURE</text>
  <text x="376" y="34" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10">JAVA 21 G1 GC</text>

  <!-- Young Generation -->
  <rect x="24" y="65" width="220" height="100" rx="10" fill="#0f172a" stroke="#f97316" stroke-width="1.5" />
  <text x="36" y="86" fill="#fb923c" font-family="sans-serif" font-weight="bold" font-size="11">Young Generation</text>
  
  <rect x="36" y="98" width="100" height="52" rx="6" fill="#431407" stroke="#ea580c" />
  <text x="86" y="122" text-anchor="middle" fill="#fdba74" font-family="monospace" font-size="10" font-weight="bold">Eden Space</text>
  <text x="86" y="136" text-anchor="middle" fill="#fed7aa" font-family="monospace" font-size="8">New Allocs</text>

  <rect x="144" y="98" width="42" height="52" rx="6" fill="#1c1917" stroke="#78716c" />
  <text x="165" y="122" text-anchor="middle" fill="#d6d3d1" font-family="monospace" font-size="9">S0</text>
  <text x="165" y="136" text-anchor="middle" fill="#a8a29e" font-family="monospace" font-size="7">From</text>

  <rect x="192" y="98" width="42" height="52" rx="6" fill="#1c1917" stroke="#78716c" />
  <text x="213" y="122" text-anchor="middle" fill="#d6d3d1" font-family="monospace" font-size="9">S1</text>
  <text x="213" y="136" text-anchor="middle" fill="#a8a29e" font-family="monospace" font-size="7">To</text>

  <!-- Old Generation -->
  <rect x="254" y="65" width="122" height="100" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
  <text x="266" y="86" fill="#60a5fa" font-family="sans-serif" font-weight="bold" font-size="11">Old Gen (Tenured)</text>
  <rect x="266" y="98" width="98" height="52" rx="6" fill="#172554" stroke="#2563eb" />
  <text x="315" y="122" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="10" font-weight="bold">Long-Lived</text>
  <text x="315" y="136" text-anchor="middle" fill="#bfdbfe" font-family="monospace" font-size="8">Tenured Objects</text>

  <!-- Non-Heap Metaspace -->
  <rect x="24" y="180" width="352" height="60" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="36" y="202" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="11">Metaspace (Native Memory)</text>
  <text x="36" y="222" fill="#a855f7" font-family="monospace" font-size="10">Class Metadata · JIT Code Cache · Constant Pool · Method Descriptors</text>

  <!-- Footer Tag -->
  <rect x="24" y="258" width="150" height="24" rx="6" fill="#431407" stroke="#ea580c" stroke-width="1" />
  <text x="99" y="274" text-anchor="middle" fill="#fed7aa" font-family="monospace" font-size="10">MINOR / MAJOR GC TUNED</text>
