<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="guruBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="guruGlowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#guruBg)" stroke="#581c87" stroke-width="2" />
  <text x="24" y="34" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">GURU AI // REAL-TIME CODE DIAGNOSTICS</text>
  <text x="376" y="34" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10">SYNTHESIS</text>

  <!-- Assistant Message Box -->
  <rect x="24" y="56" width="352" height="184" rx="12" fill="#0f172a" stroke="#7e22ce" stroke-width="1.5" />
  
  <circle cx="48" cy="80" r="14" fill="url(#guruGlowGrad)" />
  <text x="48" y="85" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">G</text>
  <text x="72" y="82" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">GuruBot Copilot</text>
  <text x="72" y="96" fill="#a855f7" font-family="monospace" font-size="9">Verified against 450+ test vectors</text>

  <!-- Metric Badges inside dialogue -->
  <g transform="translate(40, 115)">
    <rect width="90" height="36" rx="6" fill="#1e1b4b" stroke="#6366f1" />
    <text x="45" y="16" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">TIME</text>
    <text x="45" y="30" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">O(N log N)</text>

    <rect x="100" width="90" height="36" rx="6" fill="#1e1b4b" stroke="#6366f1" />
    <text x="145" y="16" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">SPACE</text>
    <text x="145" y="30" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">O(1) AUX</text>

    <rect x="200" width="120" height="36" rx="6" fill="#064e3b" stroke="#10b981" />
    <text x="260" y="16" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="8">OPTIMALITY</text>
    <text x="260" y="30" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">ASYMPTOTIC MAX</text>
  </g>

  <!-- Suggestion pill -->
  <rect x="40" y="170" width="320" height="54" rx="8" fill="#18181b" stroke="#27272a" />
  <text x="52" y="190" fill="#e2e8f0" font-family="sans-serif" font-size="11">✓ Invariant holds for empty inputs and duplicates.</text>
  <text x="52" y="210" fill="#a1a1aa" font-family="sans-serif" font-size="10">→ Recommend replacing recursion with two-pointer iteration to save call stack.</text>

  <!-- Footer Tag -->
  <rect x="24" y="258" width="140" height="24" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1" />
  <text x="94" y="274" text-anchor="middle" fill="#f3e8ff" font-family="monospace" font-size="10">INTERVIEW READY</text>
</svg>