<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="codeBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#codeBg)" stroke="#312e81" stroke-width="2" />
  
  <!-- Editor Top Bar -->
  <rect x="0" y="0" width="400" height="36" rx="16" fill="#0f172a" />
  <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="18" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="18" r="4.5" fill="#10b981" />
  <text x="70" y="22" fill="#94a3b8" font-family="monospace" font-size="11">LRUCache.java</text>
  <rect x="306" y="8" width="76" height="20" rx="4" fill="#10b981" opacity="0.2" />
  <text x="344" y="22" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">O(1) GET/PUT</text>

  <!-- Code Lines -->
  <g transform="translate(24, 60)" font-family="monospace" font-size="11">
    <text y="14" fill="#64748b">1</text>
    <text x="24" y="14" fill="#ec4899">class</text>
    <text x="64" y="14" fill="#38bdf8">LRUCache</text>
    <text x="130" y="14" fill="#e2e8f0">{</text>

    <text y="36" fill="#64748b">2</text>
    <text x="40" y="36" fill="#ec4899">private</text>
    <text x="96" y="36" fill="#e2e8f0">Map&lt;Integer, Node&gt;</text>
    <text x="228" y="36" fill="#facc15">cache</text>
    <text x="264" y="36" fill="#e2e8f0">;</text>

    <text y="58" fill="#64748b">3</text>
    <text x="40" y="58" fill="#ec4899">private</text>
    <text x="96" y="58" fill="#38bdf8">Node</text>
    <text x="132" y="58" fill="#facc15">head, tail</text>
    <text x="204" y="58" fill="#e2e8f0">;</text>

    <text y="80" fill="#64748b">4</text>
    <text x="40" y="80" fill="#ec4899">public</text>
    <text x="90" y="80" fill="#ec4899">int</text>
    <text x="118" y="80" fill="#60a5fa">get</text>
    <text x="140" y="80" fill="#e2e8f0">(int key) {</text>

    <text y="102" fill="#64748b">5</text>
    <text x="56" y="102" fill="#ec4899">if</text>
    <text x="76" y="102" fill="#e2e8f0">(!cache.containsKey(k))</text>
    <text x="236" y="102" fill="#ec4899">return</text>
    <text x="284" y="102" fill="#f87171">-1</text>
    <text x="298" y="102" fill="#e2e8f0">;</text>

    <text y="124" fill="#64748b">6</text>
    <text x="56" y="124" fill="#38bdf8">Node</text>
    <text x="90" y="124" fill="#e2e8f0">n = cache.get(k);</text>

    <text y="146" fill="#64748b">7</text>
    <text x="56" y="146" fill="#34d399">moveToHead</text>
    <text x="130" y="146" fill="#e2e8f0">(n); // evicts LRU invariant</text>

    <text y="168" fill="#64748b">8</text>
    <text x="56" y="168" fill="#ec4899">return</text>
    <text x="104" y="168" fill="#e2e8f0">n.val;</text>

    <text y="190" fill="#64748b">9</text>
    <text x="40" y="190" fill="#e2e8f0">}</text>
  </g>

  <!-- Test Suite Pass Pill -->
  <rect x="24" y="260" width="168" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <circle cx="38" cy="272" r="4" fill="#34d399" />
  <text x="48" y="276" fill="#a7f3d0" font-family="monospace" font-size="10">TEST SUITE: 22/22 PASSED</text>
</svg>