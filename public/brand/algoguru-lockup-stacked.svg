<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180" role="img" aria-labelledby="t">
  <title id="t">AlgoGuru</title>
  <defs>
    <linearGradient id="agVGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#E1542F"/>
    </linearGradient>
    <mask id="agVNodes" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g fill="#000">
        <circle cx="17" cy="46" r="2.2"/>
        <circle cx="32" cy="18" r="2.4"/>
        <circle cx="47" cy="46" r="2.2"/>
        <circle cx="22.09" cy="36.5" r="1.8"/>
        <circle cx="41.91" cy="36.5" r="1.8"/>
      </g>
    </mask>
  </defs>

  <!-- Mark is authored on a 64 grid and scaled 1.5x to 96px, centred horizontally. -->
  <g transform="translate(52 4) scale(1.5)">
    <rect width="64" height="64" rx="16" fill="url(#agVGrad)"/>
    <g mask="url(#agVNodes)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 46 L32 18 L47 46"/>
      <path d="M22.09 36.5 H41.91"/>
    </g>
  </g>

  <!-- Wordmark: Space Grotesk 600, -0.8 tracking. Convert to outlines for print/export. -->
  <text x="100" y="158" text-anchor="middle"
        font-family="'Space Grotesk','Outfit','Inter',system-ui,sans-serif"
        font-size="38" font-weight="600" letter-spacing="-0.8">
    <tspan fill="#0B0F14">Algo</tspan><tspan fill="#E1542F">Guru</tspan>
  </text>
</svg>
