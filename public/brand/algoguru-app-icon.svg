<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">AlgoGuru</title>
  <defs>
    <linearGradient id="agAppGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#E1542F"/>
    </linearGradient>
    <mask id="agAppNodes" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g fill="#000">
        <circle cx="17" cy="46" r="2.2"/>
        <circle cx="32" cy="18" r="2.4"/>
        <circle cx="47" cy="46" r="2.2"/>
        <circle cx="22.09" cy="36.5" r="1.8"/>
        <circle cx="41.91" cy="36.5" r="1.8"/>
      </g>
    </mask>
  </defs>

  <!-- Full-bleed square: iOS/Android apply their own corner mask, so no radius here. -->
  <rect width="512" height="512" fill="url(#agAppGrad)"/>

  <!-- Glyph is authored on a 64 grid, then scaled to ~59% of the canvas. -->
  <g transform="translate(256 256) scale(8.4) translate(-32 -32)">
    <g mask="url(#agAppNodes)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 46 L32 18 L47 46"/>
      <path d="M22.09 36.5 H41.91"/>
    </g>
  </g>
</svg>
