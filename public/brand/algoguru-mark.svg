<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">AlgoGuru</title>
  <defs>
    <linearGradient id="agBadgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#E1542F"/>
    </linearGradient>
    <!-- Punches the 5 graph nodes out of the glyph so the badge gradient reads through. -->
